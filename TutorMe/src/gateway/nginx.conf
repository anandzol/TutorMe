events {}

http {
  upstream monolith { server monolith:8090; }

  server {
    listen 8082;

    # Phase 0: pure passthrough to the monolith. As each domain is
    # extracted into its own service (see the microservices migration
    # plan), a location block for that resource's path prefix is added
    # here, above the catch-all, pointing at the new service instead.

    location / {
      proxy_pass http://monolith;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
